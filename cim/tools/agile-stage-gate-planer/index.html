<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agile-Stage-Gate-Planer</title>
<style>
  .viz-root{
    color-scheme:light;
    --page:#f9f9f7; --surface-1:#fcfcfb; --card:#ffffff;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
    --series-1:#2a78d6; --series-2:#eb6834; --series-7:#6250d6;
    --accent:#2a78d6; --accent-soft:#e8f0fa;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --neutral:#c3c2b7;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])) .viz-root{
      color-scheme:dark;
      --page:#0d0d0d; --surface-1:#1a1a19; --card:#1a1a19;
      --text-primary:#f0efec; --text-secondary:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
      --series-1:#3987e5; --series-2:#d95926; --series-7:#9085e9;
      --accent:#3987e5; --accent-soft:#1c2a3a; --neutral:#5a5955;
    }
  }
  :root[data-theme="dark"] .viz-root{
    color-scheme:dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --card:#1a1a19;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --series-1:#3987e5; --series-2:#d95926; --series-7:#9085e9;
    --accent:#3987e5; --accent-soft:#1c2a3a; --neutral:#5a5955;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .viz-root{background:var(--page);color:var(--text-primary);min-height:100vh}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 18px 60px}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  header h1{font-size:23px;margin:0 0 2px;font-weight:600}
  header p{margin:0;color:var(--text-secondary);font-size:14px}
  .tools{display:flex;gap:6px;flex-wrap:wrap}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:20px 0 14px;border-bottom:1px solid var(--border)}
  .tabs button{border:0;background:none;color:var(--text-secondary);padding:9px 12px;font:inherit;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.active{color:var(--text-primary);border-bottom-color:var(--accent);font-weight:600}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
  .card h2{font-size:17px;margin:0 0 4px;font-weight:600}
  .card h3{font-size:15px;margin:14px 0 6px;font-weight:600}
  .hint{color:var(--text-secondary);font-size:13.5px;margin:0 0 12px}
  label{display:block;font-weight:500;font-size:13px;margin:10px 0 3px;color:var(--text-secondary)}
  input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface-1);color:var(--text-primary);font:inherit;font-size:14px}
  textarea{min-height:60px;resize:vertical}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}
  @media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:6px 5px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  td input,td select{padding:5px 7px}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:7px 13px;border-radius:7px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.small{padding:4px 9px;font-size:13px}
  .btn.danger{border-color:var(--critical);background:var(--critical)}
  .del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:17px;line-height:1}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--border);white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .sprint{border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:10px}
  .sprint summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
  .sprint summary::-webkit-details-marker{display:none}
  .sprint summary b{font-weight:600}
  .muted{color:var(--muted)} .sec{color:var(--text-secondary)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;flex-wrap:wrap}
  .seg label{margin:0;padding:5px 10px;font-weight:400;cursor:pointer;font-size:13px;color:var(--text-primary);border-right:1px solid var(--border)}
  .seg label:last-child{border-right:0}
  .seg input{display:none}
  .seg label:has(input:checked){background:var(--accent-soft);font-weight:600}
  .verdict{display:flex;gap:16px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin:8px 0}
  .verdict .big{font-size:20px;font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  @media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .kpi .l{font-size:12.5px;color:var(--text-secondary)}
  .kpi .v{font-size:26px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:12.5px;color:var(--muted)}
  .chart{width:100%;height:auto;display:block}
  .chart text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary);margin:4px 0 8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  #tip{position:fixed;pointer-events:none;background:var(--card);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;z-index:10;max-width:260px;white-space:pre-line}
  pre{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:12px;max-height:520px;overflow:auto}
  .toast{color:var(--good);font-size:13.5px}
  .empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
  .modal{border:1px solid var(--critical);border-radius:10px;padding:12px;margin-top:10px}
</style>
</head>
<body>
<div class="viz-root">
<div class="wrap">
  <header>
    <div>
      <h1>Agile-Stage-Gate-Planer</h1>
      <p>Hybrid nach Cooper (2016): Gates bleiben Investitionsentscheidungen, in den Stages wird in Sprints gearbeitet.</p>
    </div>
    <div class="tools">
      <button class="btn ghost small" id="saveJson">Projekt speichern (.json)</button>
      <label class="btn ghost small" style="margin:0;color:var(--accent)">Projekt laden (.json/.md)<input type="file" id="loadJson" accept=".json,.md,application/json,text/markdown" style="display:none"></label>
      <button class="btn ghost small" id="demo">Beispiel laden</button>
      <button class="btn ghost small" id="newp">Neu</button>
    </div>
  </header>
  <div id="confirm"></div>
  <span class="toast" id="gtoast"></span>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="tip"></div>
</div>

<script>
/* ================= Modell ================= */
const TABS=[["projekt","1 · Projekt"],["plan","2 · Plan"],["hyp","3 · Hypothesen"],["sprints","4 · Sprints"],["gates","5 · Gates"],["auswertung","6 · Auswertung"],["export","7 · Export"]];
const DECISIONS=["Go","Hold","Recycle","Pivot","Kill"];
const DEC_COLOR={Go:"var(--good)",Hold:"var(--warning)",Recycle:"var(--serious)",Pivot:"var(--series-7)",Kill:"var(--critical)"};
const H_STATUS=[["offen","offen","var(--neutral)"],["test","in Test","var(--warning)"],["ok","bestätigt","var(--good)"],["nok","verworfen","var(--critical)"]];
const H_TYPES=["Kunde/Problem","Lösung/Wert","Markt","Technik","Wirtschaftlichkeit"];
const MUST=["Strategischer Fit","Technische Machbarkeit grundsätzlich gegeben","Kein K.-o. (Recht, Sicherheit, Regulatorik)","Chance-Risiko-Verhältnis vertretbar"];
const SHOULD=[["Kundennutzen nachgewiesen",25],["Marktattraktivität",20],["Wettbewerbsvorteil",15],["Technische Reife",20],["Wirtschaftlichkeit",20]];
let uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);

function freshProject(){
  const st=[["Scoping",2,20,"Problem und Zielgruppe verstanden"],["Business Case",3,40,"Lösung und Geschäftsmodell validiert"],["Entwicklung",6,150,"Funktionsfähiges MVP"],["Test & Validierung",3,60,"Pilotkunden bestätigen Nutzen"],["Launch",2,50,"Markteinführung"]];
  return {v:1,tab:"projekt",
    p:{name:"",vision:"",po:"",team:"",gatekeeper:"",start:today(),sprintLen:2,budgetUnit:"T€",uTech:"mittel",uMarkt:"hoch"},
    stages:st.map(([n,s,b,g])=>({id:uid(),name:n,sprints:s,budget:b,goal:g})),
    must:MUST.slice(), should:SHOULD.map(([t,w])=>({t,w})),
    hyps:[], sprints:[], gates:{}};
}
const KEY="agile-stage-gate-v1";
let S; try{S=JSON.parse(localStorage.getItem(KEY))||freshProject();}catch(e){S=freshProject();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ================= Helfer ================= */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mdc=s=>String(s??"").replace(/\|/g,"\\|").replace(/\n+/g,"<br>");
const D=s=>{const d=new Date(s+"T00:00:00");return isNaN(d)?null:d;};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDays=(s,n)=>{const d=D(s)||new Date();d.setDate(d.getDate()+n);return iso(d);};
const fd=s=>{const d=D(s);return d?d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"}):"–";};
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:n;};
const fmtN=n=>(Math.round(n*10)/10).toLocaleString("de-DE");
function getPath(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[k],o);}
function setPath(o,p,v){const ks=p.split(".");let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]={};a=a[ks[i]];}a[ks.at(-1)]=v;}
const stageById=id=>S.stages.find(s=>s.id===id);
const stageIdx=id=>S.stages.findIndex(s=>s.id===id);

function planSchedule(){
  let cur=S.p.start||today(); const len=num(S.p.sprintLen)||2;
  return S.stages.map(s=>{const st=cur,en=addDays(cur,Math.round(num(s.sprints)*len*7));cur=en;return {id:s.id,start:st,end:en};});
}
function stageActual(id){
  const sp=S.sprints.filter(x=>x.stage===id&&x.start);
  if(!sp.length) return null;
  return {start:sp.map(x=>x.start).sort()[0],end:sp.map(x=>x.end||x.start).sort().at(-1),n:sp.length,
          budget:sp.reduce((a,x)=>a+num(x.budget),0)};
}
function gateOf(id){ if(!S.gates[id]) S.gates[id]={date:"",must:{},should:{},decision:"",released:"",reason:"",cond:""}; return S.gates[id]; }
function currentStage(){ for(const s of S.stages){const g=S.gates[s.id]; if(!g||g.decision!=="Go") return s;} return S.stages.at(-1); }
function gateScore(id){
  const g=S.gates[id]; if(!g) return null; let sw=0,sum=0;
  S.should.forEach((c,i)=>{const v=g.should[i]; if(v){sw+=num(c.w);sum+=num(c.w)*num(v);}});
  return sw?Math.round(sum/(sw*5)*100):null;
}
function gateSuggestion(id){
  const g=gateOf(id); const hs=S.hyps.filter(h=>h.stage===id&&h.crit);
  const no=S.must.filter((_,i)=>g.must[i]==="nein").length, open=S.must.filter((_,i)=>!g.must[i]||g.must[i]==="offen").length;
  const hNok=hs.filter(h=>h.status==="nok").length, hOpen=hs.filter(h=>h.status==="offen"||h.status==="test").length;
  const sc=gateScore(id);
  if(no) return {d:"Kill",why:`${no} Must-meet-${no===1?"Kriterium":"Kriterien"} nicht erfüllt.`};
  if(hNok) return {d:"Pivot",why:`${hNok} kritische ${hNok===1?"Hypothese":"Hypothesen"} verworfen – Richtung ändern statt weiterbauen.`};
  if(open) return {d:"Hold",why:`${open} Must-meet-${open===1?"Kriterium":"Kriterien"} noch offen.`};
  if(hOpen) return {d:"Recycle",why:`${hOpen} kritische ${hOpen===1?"Hypothese":"Hypothesen"} noch nicht bestätigt – weitere Sprints in dieser Stage.`};
  if(sc===null) return {d:"–",why:"Should-meet noch nicht bewertet."};
  if(sc>=70) return {d:"Go",why:`Must-meet erfüllt, kritische Hypothesen bestätigt, Score ${sc} %.`};
  if(sc>=50) return {d:"Recycle",why:`Score ${sc} % (50–69 %): nachschärfen.`};
  return {d:"Kill",why:`Score ${sc} % (< 50 %).`};
}
function processHint(){
  const t=S.p.uTech,m=S.p.uMarkt;
  if(t==="hoch"&&m==="hoch") return "Technik und Markt hoch unsicher → Hybrid mit Effectuation-Logik: kurze Sprints, viele Hypothesentests, Gates eher als Lern-Meilensteine.";
  if(m==="hoch") return "Hohe Marktunsicherheit → Lean-Startup-Elemente in die frühen Stages: Kundenhypothesen zuerst testen.";
  if(t==="hoch") return "Hohe Technikunsicherheit → TRL-Gates ergänzen: technische Reife an jedem Gate prüfen.";
  if(t==="niedrig"&&m==="niedrig") return "Geringe Unsicherheit → klassisches Stage-Gate würde reichen; Sprints vor allem in der Entwicklung.";
  return "Mittlere Unsicherheit → Next-Generation Stage-Gate: adaptiv, agil, accelerated (überlappende Stages, wenige gute Gates).";
}
const decPill=d=>d?`<span class="pill"><span class="dot" style="background:${DEC_COLOR[d]||"var(--neutral)"}"></span>${esc(d)}</span>`:`<span class="pill muted">offen</span>`;
const hStat=k=>H_STATUS.find(x=>x[0]===k)||H_STATUS[0];
const opt=(arr,val)=>arr.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(val)===String(v)?"selected":""}>${esc(l)}</option>`;}).join("");
const stageOpts=val=>S.stages.map((s,i)=>`<option value="${s.id}" ${val===s.id?"selected":""}>${i+1}. ${esc(s.name)}</option>`).join("");

/* ================= Tabs ================= */
const view=document.getElementById("view");
function render(){
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?"active":""}">${l}</button>`).join("");
  view.innerHTML=({projekt:tProjekt,plan:tPlan,hyp:tHyp,sprints:tSprints,gates:tGates,auswertung:tAuswertung,export:tExport}[S.tab]||tProjekt)();
  if(S.tab==="export") setupExport();
}

function tProjekt(){const p=S.p;return `
<div class="card"><h2>Projektsteckbrief</h2><p class="hint">Einmal zu Beginn ausfüllen. Alles lässt sich später anpassen.</p>
 <div class="g2">
  <div><label>Projektname</label><input data-b="p.name" value="${esc(p.name)}"></div>
  <div><label>Projektstart</label><input type="date" data-b="p.start" value="${esc(p.start)}"></div>
 </div>
 <label>Vision / Ziel</label><textarea data-b="p.vision" placeholder="Für wen lösen wir welches Problem – und woran merken wir Erfolg?">${esc(p.vision)}</textarea>
 <h3>Rollen</h3>
 <div class="g3">
  <div><label>Product Owner</label><input data-b="p.po" value="${esc(p.po)}"></div>
  <div><label>Team</label><input data-b="p.team" value="${esc(p.team)}" placeholder="Namen, Komma-getrennt"></div>
  <div><label>Gatekeeper</label><input data-b="p.gatekeeper" value="${esc(p.gatekeeper)}" placeholder="entscheiden über Budget"></div>
 </div>
 <h3>Rahmen</h3>
 <div class="g4">
  <div><label>Sprintlänge (Wochen)</label><select data-b="p.sprintLen" data-num data-rr>${opt([1,2,3,4],p.sprintLen)}</select></div>
  <div><label>Budget-Einheit</label><input data-b="p.budgetUnit" value="${esc(p.budgetUnit)}"></div>
  <div><label>Unsicherheit Technik</label><select data-b="p.uTech" data-rr>${opt(["niedrig","mittel","hoch"],p.uTech)}</select></div>
  <div><label>Unsicherheit Markt</label><select data-b="p.uMarkt" data-rr>${opt(["niedrig","mittel","hoch"],p.uMarkt)}</select></div>
 </div>
 <p class="hint" style="margin-top:12px;background:var(--accent-soft);padding:10px 12px;border-radius:8px;color:var(--text-primary)">${processHint()}</p>
</div>`;}

function tPlan(){
  const sch=planSchedule(), u=esc(S.p.budgetUnit);
  const tot=S.stages.reduce((a,s)=>a+num(s.budget),0), totS=S.stages.reduce((a,s)=>a+num(s.sprints),0);
  return `
<div class="card"><h2>Stages, Sprints & Budget</h2><p class="hint">Plane pro Stage die Anzahl Sprints und das Budget. Am Ende jeder Stage steht ein Gate. Termine ergeben sich aus Start und Sprintlänge.</p>
<table><tr><th>#</th><th>Stage</th><th>Ziel der Stage</th><th style="width:80px">Sprints</th><th style="width:95px">Budget ${u}</th><th>Plan</th><th></th></tr>
${S.stages.map((s,i)=>`<tr><td class="muted">${i+1}</td><td><input data-b="stages.${i}.name" value="${esc(s.name)}"></td><td><input data-b="stages.${i}.goal" value="${esc(s.goal)}"></td>
<td><input type="number" min="0" data-b="stages.${i}.sprints" data-num data-rr value="${s.sprints}"></td><td><input type="number" min="0" data-b="stages.${i}.budget" data-num data-rr value="${s.budget}"></td>
<td class="sec" style="white-space:nowrap;font-size:13px">${fd(sch[i].start)} – ${fd(sch[i].end)}</td>
<td>${S.stages.length>1?`<button class="del" data-delstage="${i}" title="Stage entfernen">×</button>`:""}</td></tr>`).join("")}
<tr><td></td><td><b>Gesamt</b></td><td></td><td><b>${fmtN(totS)}</b></td><td><b>${fmtN(tot)}</b></td><td class="sec" style="font-size:13px">bis ${fd(sch.at(-1)?.end)}</td><td></td></tr></table>
<button class="btn ghost small" style="margin-top:10px" id="addstage">+ Stage</button></div>

<div class="card"><h2>Gate-Kriterien</h2><p class="hint">Gelten für alle Gates. Must-meet = K.-o., Should-meet = gewichtetes Scoring 1–5.</p>
<div class="g2"><div><h3>Must-meet</h3>
${S.must.map((m,i)=>`<div class="row" style="margin-bottom:6px"><input data-b="must.${i}" value="${esc(m)}"><button class="del" data-delmust="${i}">×</button></div>`).join("")}
<button class="btn ghost small" id="addmust">+ Kriterium</button></div>
<div><h3>Should-meet</h3>
${S.should.map((c,i)=>`<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><input data-b="should.${i}.t" value="${esc(c.t)}"><input type="number" style="width:70px" data-b="should.${i}.w" data-num value="${c.w}" title="Gewicht %"><span class="muted">%</span><button class="del" data-delshould="${i}">×</button></div>`).join("")}
<button class="btn ghost small" id="addshould">+ Kriterium</button></div></div></div>`;}

function tHyp(){
  return `<div class="card"><h2>Hypothesen-Backlog</h2><p class="hint">Was muss stimmen, damit das Projekt erfolgreich ist? Kritische Hypothesen (★) müssen vor dem Gate ihrer Stage bestätigt sein. Status ändert sich über die Sprints.</p>
${S.hyps.length?`<table><tr><th style="width:30px">★</th><th>Hypothese</th><th style="width:140px">Typ</th><th style="width:150px">Stage</th><th style="width:120px">Status</th><th>Test / Messkriterium</th><th></th></tr>
${S.hyps.map((h,i)=>`<tr><td><input type="checkbox" data-b="hyps.${i}.crit" data-bool ${h.crit?"checked":""} style="width:auto" title="kritisch"></td>
<td><input data-b="hyps.${i}.t" value="${esc(h.t)}" placeholder="Wir glauben, dass …"></td><td><select data-b="hyps.${i}.type">${opt(H_TYPES,h.type)}</select></td>
<td><select data-b="hyps.${i}.stage">${stageOpts(h.stage)}</select></td><td><select data-b="hyps.${i}.status">${opt(H_STATUS.map(x=>[x[0],x[1]]),h.status)}</select></td>
<td><input data-b="hyps.${i}.test" value="${esc(h.test)}" placeholder="bestätigt, wenn …"></td><td><button class="del" data-delhyp="${i}">×</button></td></tr>`).join("")}</table>`:`<div class="empty">Noch keine Hypothesen.</div>`}
<button class="btn ghost small" style="margin-top:10px" id="addhyp">+ Hypothese</button></div>`;}

function tSprints(){

}

const T=s=>esc(s).replace(/\n/g,"&#10;");
function chartRoadmap(){
  const sch=planSchedule(); if(!S.stages.length) return `<div class="empty">Keine Stages.</div>`;
  const dates=[]; sch.forEach(x=>{dates.push(D(x.start),D(x.end));});
  S.sprints.forEach(x=>{if(D(x.start))dates.push(D(x.start));if(D(x.end))dates.push(D(x.end));});
  Object.values(S.gates).forEach(g=>{if(D(g.date))dates.push(D(g.date));});
  const mn=new Date(Math.min(...dates)), mx=new Date(Math.max(...dates)); const span=Math.max(1,mx-mn);
  const W=920,L=150,R=90,rowH=50,top=26,H=top+S.stages.length*rowH+8;
  const x=d=>L+(D(d)-mn)/span*(W-L-R);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Roadmap Plan gegen Ist">`;
  // Monatsraster
  const m=new Date(mn.getFullYear(),mn.getMonth(),1);
  s+=`<text x="${L}" y="14" font-size="11" fill="var(--muted)">${mn.toLocaleDateString("de-DE",{day:"2-digit",month:"short"})}</text>`;
  while(m<=mx){ if(m>=mn){const xx=L+(m-mn)/span*(W-L-R); const lab=xx-L>48; s+=`<line x1="${xx}" x2="${xx}" y1="${top-6}" y2="${H-8}" stroke="var(--grid)"/>${lab?`<text x="${xx+3}" y="14" font-size="11" fill="var(--muted)">${m.toLocaleDateString("de-DE",{month:"short",year:"2-digit"})}</text>`:""}`;} m.setMonth(m.getMonth()+1);}
  const td=today(); if(D(td)>=mn&&D(td)<=mx){const xx=x(td);s+=`<line x1="${xx}" x2="${xx}" y1="${top-6}" y2="${H-8}" stroke="var(--text-secondary)" stroke-dasharray="3 3"/><text x="${xx}" y="${H}" font-size="11" fill="var(--text-secondary)" text-anchor="middle">heute</text>`;}
  S.stages.forEach((st,i)=>{
    const y=top+i*rowH; const p=sch[i];
    s+=`<text x="0" y="${y+16}" font-size="13" fill="var(--text-primary)">${i+1}. ${esc(st.name.length>18?st.name.slice(0,17)+"…":st.name)}</text>`;
    s+=`<rect x="${x(p.start)}" y="${y+6}" width="${Math.max(3,x(p.end)-x(p.start)-2)}" height="9" rx="4" fill="var(--grid)" stroke="var(--axis)" data-tip="${T(`${st.name} – Plan\n${fd(p.start)} – ${fd(p.end)}\n${st.sprints} Sprints · ${fmtN(num(st.budget))} ${S.p.budgetUnit}`)}"/>`;
    S.sprints.map((sp,j)=>({sp,j})).filter(o=>o.sp.stage===st.id&&D(o.sp.start)).forEach(({sp,j})=>{
      const x1=x(sp.start), x2=x(sp.end||addDays(sp.start,num(S.p.sprintLen)*7));
      s+=`<rect x="${x1}" y="${y+21}" width="${Math.max(3,x2-x1-2)}" height="12" rx="4" fill="var(--series-1)" data-tip="${T(`Sprint ${j+1} – ${st.name}\n${fd(sp.start)} – ${fd(sp.end)}\n${sp.goal||""}${sp.goalMet?`\nZiel: ${sp.goalMet}`:""}`)}"/>`;
    });
    const g=S.gates[st.id]; const gd=g&&g.date?g.date:p.end; const gx=x(gd), gy=y+19, c=g&&g.decision?DEC_COLOR[g.decision]:"var(--surface-1)";
    s+=`<path d="M${gx} ${gy-8} L${gx+8} ${gy} L${gx} ${gy+8} L${gx-8} ${gy} Z" fill="${c}" stroke="${g&&g.decision?"var(--surface-1)":"var(--muted)"}" stroke-width="2" data-tip="${T(`Gate ${i+1}${g&&g.date?" am "+fd(g.date):" (Plan "+fd(p.end)+")"}\nEntscheidung: ${g&&g.decision||"offen"}`)}"/>`;
    s+=`<text x="${gx+12}" y="${gy+4}" font-size="12" fill="var(--text-secondary)">${g&&g.decision?esc(g.decision):""}</text>`;

}
function chartBudget(){
  const rows=S.stages.map(st=>({n:st.name,p:num(st.budget),a:stageActual(st.id)?.budget||0}));
  const mx=Math.max(1,...rows.map(r=>Math.max(r.p,r.a))); const nice=niceMax(mx);
  const W=920,L=50,B=40,top=14,H=260, cw=(W-L-10)/rows.length, bw=Math.min(34,cw/3.2);
  const y=v=>top+(H-top-B)*(1-v/nice);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Budget je Stage">`;
  for(let t=0;t<=4;t++){const v=nice*t/4,yy=y(v);s+=`<line x1="${L}" x2="${W-10}" y1="${yy}" y2="${yy}" stroke="${t?"var(--grid)":"var(--axis)"}"/><text x="${L-8}" y="${yy+4}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtN(v)}</text>`;}
  rows.forEach((r,i)=>{const cx=L+cw*i+cw/2;
    s+=bar(cx-bw-1,y(r.p),bw,y(0)-y(r.p),"var(--series-1)",`${r.n}\nPlan: ${fmtN(r.p)} ${S.p.budgetUnit}`);
    s+=bar(cx+1,y(r.a),bw,y(0)-y(r.a),"var(--series-2)",`${r.n}\nVerbraucht: ${fmtN(r.a)} ${S.p.budgetUnit}${r.p?` (${Math.round(r.a/r.p*100)} %)`:""}`);
    if(r.a>0) s+=`<text x="${cx+1+bw/2}" y="${y(r.a)-5}" font-size="11" fill="var(--text-secondary)" text-anchor="middle">${fmtN(r.a)}</text>`;
    s+=`<text x="${cx}" y="${H-B+18}" font-size="12" fill="var(--text-secondary)" text-anchor="middle">${esc(r.n.length>16?r.n.slice(0,15)+"…":r.n)}</text>`;});
  s+=`</svg>`;
  return `<div class="legend"><span><i class="sw" style="background:var(--series-1)"></i>Geplant</span><span><i class="sw" style="background:var(--series-2)"></i>Verbraucht</span></div>`+s;
}
function bar(x,y,w,h,fill,tip){ if(h<=0) return ""; const r=Math.min(4,h,w/2);
  return `<path d="M${x} ${y+h} V${y+r} Q${x} ${y} ${x+r} ${y} H${x+w-r} Q${x+w} ${y} ${x+w} ${y+r} V${y+h} Z" fill="${fill}" data-tip="${T(tip)}"/>`;}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function chartHyp(){

  return `<div class="legend">${H_STATUS.map(([k,l,c])=>`<span><i class="sw" style="background:${c}"></i>${l}</span>`).join("")}</div>`+s;

  rows.forEach((r,k)=>{const cx=L+cw*k+cw/2; const d=r.g&&r.g.decision;
    s+=bar(cx-bw/2,y(r.sc),bw,y(0)-y(r.sc),"var(--series-1)",`Gate ${r.i+1} – ${r.st.name}\nScore: ${r.sc} %\nEntscheidung: ${d||"offen"}`);
    s+=`<text x="${cx}" y="${y(r.sc)-6}" font-size="12" fill="var(--text-primary)" text-anchor="middle" font-weight="600">${r.sc} %</text>`;
    s+=`<text x="${cx}" y="${H-B+17}" font-size="12" fill="var(--text-secondary)" text-anchor="middle">Gate ${r.i+1}</text>`;
    s+=`<circle cx="${cx-24}" cy="${H-B+32}" r="4.5" fill="${d?DEC_COLOR[d]:"var(--neutral)"}"/><text x="${cx-15}" y="${H-B+36}" font-size="12" fill="var(--text-secondary)">${d||"offen"}</text>`;});
  [[70,"Go-Schwelle 70 %"],[50,"50 %"]].forEach(([v,l])=>{s+=`<line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--text-secondary)" stroke-dasharray="4 4"/><text x="${W-12}" y="${y(v)-5}" font-size="11" fill="var(--text-secondary)" text-anchor="end">${l}</text>`;});
  return s+`</svg>`;
}

  S.stages.forEach((s,i)=>L.push(`  ${mm(s.name)} :p${i}, ${sch[i].start}, ${sch[i].end}`));
  if(S.sprints.some(x=>x.start&&x.end)){L.push("  section Sprints (Ist)");S.sprints.forEach((x,i)=>{if(x.start&&x.end)L.push(`  S${i+1} ${mm(stageById(x.stage)?.name)} :done, s${i}, ${x.start}, ${x.end}`);});}
  L.push("  section Gates");

  L.push("```","");

    L.push("","```mermaid",`pie title Hypothesen nach Status`);

    L.push("```","");
  } else L.push("Noch keine Hypothesen.","");
  L.push("## Sprint-Log","");
  if(S.sprints.length){
    L.push(`| Sprint | Stage | Zeitraum | Ziel | erreicht | Zuversicht | Budget (${u}) |`,"|---|---|---|---|---|---|---|");
    S.sprints.forEach((x,i)=>L.push(`| ${i+1} | ${mdc(stageById(x.stage)?.name)} | ${fd(x.start)} – ${fd(x.end)} | ${mdc(x.goal)} | ${x.goalMet||"–"} | ${x.conf||"–"} | ${fmtN(num(x.budget))} |`));
    L.push("");
    S.sprints.forEach((x,i)=>{L.push(`### Sprint ${i+1}: ${x.goal||""}`.trim(),"");
      [["Ergebnis",x.result],["Feedback",x.feedback],["Learnings",x.learn],["Nächste Schritte",x.next]].forEach(([l,v])=>{if(v&&v.trim())L.push(`**${l}:** ${v.trim()}`,"");});

    const sc=gateScore(s.id), sg=gateSuggestion(s.id);

    if(g.reason)L.push(`**Begründung:** ${g.reason}`,""); if(g.cond)L.push(`**Auflagen:** ${g.cond}`,"");
    L.push("| Must-meet | Erfüllt |","|---|---|"); S.must.forEach((m,k2)=>L.push(`| ${mdc(m)} | ${g.must[k2]==="ja"?"✅ ja":g.must[k2]==="nein"?"❌ nein":"⏳ offen"} |`));

  if(!S.stages.some(s=>S.gates[s.id]&&S.gates[s.id].decision)) L.push("Noch keine Gate-Entscheidung.","");
  L.push("---","","*Erstellt mit dem Agile-Stage-Gate-Planer (Cooper 2014/2016). Mermaid-Diagramme werden z. B. auf GitHub, in Obsidian und Notion direkt gerendert.*");
  L.push("",`<!-- agile-stage-gate-data:${b64e(JSON.stringify({...S,tab:"auswertung"}))} -->`);
  return L.join("\n");

  else if(ds.delmust!==undefined){S.must.splice(+ds.delmust,1);}

  else if(ds.delhyp!==undefined){S.hyps.splice(+ds.delhyp,1);}

  const flush=()=>{ if(para.length){ rich(pdfInline(para.join(" ")).replace(/^\*(?!\*)(.*)\*$/,"$1")); y+=1.8; para=[]; } };
  while(i<lines.length){ const raw=lines[i]; const t=raw.trim();
    if(inCode){ if(t.startsWith("```")){ inCode=false; y+=2; } else if(!(codeLang==="mermaid"&&opts.skipMermaid!==false)){ ensure(4); doc.setFont("courier","normal"); doc.setFontSize(8.5); doc.setTextColor(60); doc.text(pdfSafe(raw),M+2,y+3); y+=3.8; } i++; continue; }
    if(t.startsWith("```")){ flush(); inCode=true; codeLang=t.slice(3).trim(); i++; continue; }
    if(t.startsWith("<!--")){ flush(); i++; continue; }
    if(!t){ flush(); i++; continue; }
    if(/^#{1,3}\s/.test(t)){ flush(); const lvl=t.match(/^#+/)[0].length, txt=pdfInline(t.replace(/^#+\s*/,""));
      const size=[0,17,13.5,11.5][lvl]; y+=lvl===1?0:3; ensure(size*0.5+8);
      rich(txt,{size,boldAll:true,color:lvl===1?[20,20,20]:[31,95,139]});
      if(lvl<=2){ doc.setDrawColor(lvl===1?120:200); doc.setLineWidth(lvl===1?0.5:0.25); doc.line(M,y+0.5,W-M,y+0.5); y+=3; } else y+=1; i++; continue; }
    if(/^---+$/.test(t)){ flush(); ensure(5); doc.setDrawColor(200); doc.setLineWidth(0.2); doc.line(M,y+2,W-M,y+2); y+=5; i++; continue; }
    if(t.startsWith("|")){ flush(); const rows=[]; while(i<lines.length&&lines[i].trim().startsWith("|")){ if(!/^\|\s*:?-{2,}/.test(lines[i].trim())) rows.push(pdfCells(lines[i])); i++; }
      const head=rows.shift()||[]; const noHead=head.every(c=>!c); ensure(12);
      doc.autoTable({startY:y,head:noHead?undefined:[head],body:rows,margin:{left:M,right:M},theme:"grid",
        styles:{font:"helvetica",fontSize:8.6,cellPadding:1.6,textColor:[29,31,34],lineColor:[210,210,205],lineWidth:0.15,overflow:"linebreak"},
        headStyles:{fillColor:[31,95,139],textColor:255,fontStyle:"bold"},columnStyles:noHead?{0:{fontStyle:"bold",cellWidth:48}}:{} ,
        didDrawPage:()=>{}});
      y=doc.lastAutoTable.finalY+4; continue; }
    if(/^[-*]\s+/.test(t)){ flush(); while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){ const lt=lines[i].replace(/^\s*[-*]\s+/,""); const ind=/^\s{2,}/.test(lines[i])?5:0; ensure(5);
        doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(29,31,34); doc.text("•",M+1+ind,y+3.5); rich(pdfInline(lt),{x:M+5+ind,width:CW-5-ind}); y+=0.6; i++; } y+=1.6; continue; }
    if(/^\d+\.\s+/.test(t)){ flush(); while(i<lines.length&&/^\d+\.\s+/.test(lines[i].trim())){ const m=lines[i].trim().match(/^(\d+)\.\s+(.*)$/); ensure(5); doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(29,31,34); doc.text(m[1]+".",M+1,y+3.5); rich(pdfInline(m[2]),{x:M+6,width:CW-6}); y+=0.6; i++; } y+=1.6; continue; }
    if(t.startsWith(">")){ flush(); const y0=y; rich(pdfInline(t.replace(/^>\s*/,"")),{x:M+4,width:CW-4,italic:true,color:[70,70,70]}); doc.setDrawColor(31,95,139); doc.setLineWidth(0.8); doc.line(M+1,y0+0.5,M+1,y-0.5); y+=2; i++; continue; }
    para.push(t); i++; }
  flush();
  return {doc,get y(){return y;},set y(v){y=v;},ensure,M,CW};
}
function pdfFooter(doc,title,from=1){ const n=doc.getNumberOfPages(); for(let p=from;p<=n;p++){ doc.setPage(p); const w=doc.internal.pageSize.getWidth(), h=doc.internal.pageSize.getHeight();
  doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(140); doc.text(pdfSafe(title||""),12,h-6); doc.text(`Seite ${p} von ${n}`,w-12,h-6,{align:"right"}); } }
// SVG-String -> PNG-DataURL (für Diagramme im PDF)
function pdfSvgToPng(svg,w,h,scale=2.5,fmt="png"){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"}));
  img.onload=()=>{ try{ const c=document.createElement("canvas"); c.width=Math.round(w*scale); c.height=Math.round(h*scale); const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(fmt==="jpeg"?c.toDataURL("image/jpeg",0.9):c.toDataURL("image/png")); }catch(e){rej(e);} };
  img.onerror=()=>rej(new Error("SVG")); img.src=url; }); }

const PDF_LIGHT={"page":"#f9f9f7","surface-1":"#fcfcfb","card":"#ffffff","text-primary":"#0b0b0b","text-secondary":"#52514e","muted":"#898781","grid":"#e1e0d9","axis":"#c3c2b7","series-1":"#2a78d6","series-2":"#eb6834","series-7":"#6250d6","accent":"#2a78d6","good":"#0ca30c","warning":"#fab219","serious":"#ec835a","critical":"#d03b3b","neutral":"#c3c2b7"};
const pdfVar=s=>String(s).replace(/var\(--([a-z0-9-]+)\)/g,(_,k)=>PDF_LIGHT[k]||"#888888");
const hexRgb=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(h||"");const n=m?parseInt(m[1],16):0x888888;return [n>>16&255,n>>8&255,n&255];};
async function planerPdf(){
  const J=await pdfLibs();
  const md=buildMd().replace(/```mermaid\ngantt[\s\S]*?```/,"Die Roadmap als Diagramm steht unter „Grafische Auswertung“ am Ende des Dokuments.").replace(/```mermaid\npie[\s\S]*?```\n?/,"")
    .replace(/ Mermaid-Diagramme werden z\. B\. auf GitHub, in Obsidian und Notion direkt gerendert\./,"");
  const r=pdfFromMd(J,md); const doc=r.doc;
  doc.addPage("a4","portrait"); r.y=r.M;
  doc.setFont("helvetica","bold"); doc.setFontSize(17); doc.setTextColor(20); doc.text("Grafische Auswertung",r.M,r.y+6); r.y+=9; doc.setDrawColor(120); doc.setLineWidth(0.5); doc.line(r.M,r.y,210-r.M,r.y); r.y+=6;
  const charts=[["Roadmap: Plan vs. Ist",chartRoadmap()],["Budget je Stage ("+S.p.budgetUnit+")",chartBudget()],["Hypothesen-Status je Stage",chartHyp()],["Zuversicht über die Sprints",chartConf()],["Gate-Scores",chartGates()]];
  for(const [title,html] of charts){
    const m=html.match(/<svg[\s\S]*<\/svg>/); if(!m) continue;
    const vb=m[0].match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/); const w=+vb[1], h=+vb[2];
    const svg=pdfVar(m[0]).replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" ');
    const png=await pdfSvgToPng(svg,w,h,2.4); const ih=r.CW*h/w;
    r.ensure(ih+16);
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(31,95,139); doc.text(pdfSafe(title),r.M,r.y+4); r.y+=7;
    const leg=new DOMParser().parseFromString(html,"text/html").querySelectorAll(".legend span"); let lx=r.M;
    doc.setFont("helvetica","normal"); doc.setFontSize(8);
    leg.forEach(sp=>{ const st=sp.querySelector("i")?.getAttribute("style")||""; const bg=(st.match(/background:([^;]+)/)||[])[1]; const txt=pdfSafe(sp.textContent.trim());
      const tw=doc.getTextWidth(txt)+7; if(lx+tw>210-r.M){ lx=r.M; r.y+=4.5; }
      if(bg&&!/surface/.test(bg)){ doc.setFillColor(...hexRgb(pdfVar(bg).trim())); doc.rect(lx,r.y-0.2,3,3,"F"); } else { doc.setDrawColor(137); doc.setLineWidth(0.3); doc.rect(lx,r.y-0.2,3,3); }
      doc.setTextColor(82); doc.text(txt,lx+4.2,r.y+2.4); lx+=tw; });
    if(leg.length) r.y+=5.5;
    doc.addImage(png,"PNG",r.M,r.y,r.CW,ih,undefined,"FAST"); r.y+=ih+8;
  }
  pdfFooter(doc,`${S.p.name||"Projekt"} · Agile-Stage-Gate`);
  return doc.output("blob");
}
